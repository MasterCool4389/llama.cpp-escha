name: CI (CUDA, Windows) Nvidia

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GGML_NLOOP: 3
  GGML_N_THREADS: 1
  LLAMA_ARG_LOG_COLORS: 1
  LLAMA_ARG_LOG_PREFIX: 1
  LLAMA_ARG_LOG_TIMESTAMPS: 1

jobs:
  cuda:
    runs-on: windows-2022

    permissions:
      actions: write

    strategy:
      matrix:
        cuda: ['13.3']

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: release-windows-2022-x64-cuda-${{ matrix.cuda }}

      - name: Install CUDA Toolkit
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ matrix.cuda }}

      - name: Show CUDA installation
        shell: powershell
        run: |
          Write-Host "CUDA_PATH = $env:CUDA_PATH"

          if ($env:CUDA_PATH) {
            Write-Host "CUDA bin:"
            Get-ChildItem "$env:CUDA_PATH\bin" |
              Select-Object Name, Length
          }

      - name: Install Ninja
        shell: powershell
        run: |
          choco install ninja -y

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DLLAMA_BUILD_SERVER=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON

          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1

          cmake --build build --config Release -j %NINJA_JOBS%

      - name: Package CUDA runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $output = Resolve-Path "build/bin/Release"

          Write-Host "Output directory:"
          Write-Host $output

          # Find CUDA installation robustly.
          $cudaRoot = $env:CUDA_PATH

          if (-not $cudaRoot -or -not (Test-Path "$cudaRoot\bin")) {
              Write-Host "CUDA_PATH unavailable. Searching standard CUDA locations..."

              $cudaCandidates = @(
                  "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3",
                  "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2",
                  "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.1",
                  "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.0"
              )

              foreach ($candidate in $cudaCandidates) {
                  if (Test-Path "$candidate\bin") {
                      $cudaRoot = $candidate
                      break
                  }
              }
          }

          if (-not $cudaRoot -or -not (Test-Path "$cudaRoot\bin")) {
              Write-Error "Could not locate CUDA installation."
              exit 1
          }

          Write-Host "Using CUDA installation:"
          Write-Host $cudaRoot

          $cudaBin = Join-Path $cudaRoot "bin"

          # Copy CUDA runtime libraries used by ggml-cuda.
          $cudaDlls = @(
              "cudart64_13.dll",
              "cublas64_13.dll",
              "cublasLt64_13.dll"
          )

          foreach ($dll in $cudaDlls) {
              $source = Join-Path $cudaBin $dll
              $destination = Join-Path $output $dll

              if (-not (Test-Path $source)) {
                  Write-Error "CUDA DLL not found: $source"
                  exit 1
              }

              Copy-Item $source $destination -Force

              Write-Host "Copied $dll"
          }

      - name: Verify package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $dir = Resolve-Path "build/bin/Release"

          $required = @(
              "llama-server.exe",
              "llama-server-impl.dll",
              "llama-cli.exe",
              "llama-cli-impl.dll",
              "llama.dll",
              "llama-common.dll",
              "ggml.dll",
              "ggml-base.dll",
              "ggml-cpu.dll",
              "ggml-cuda.dll",
              "cudart64_13.dll",
              "cublas64_13.dll",
              "cublasLt64_13.dll"
          )

          Write-Host ""
          Write-Host "=== VERIFYING BUILD ==="
          Write-Host ""

          foreach ($file in $required) {
              $path = Join-Path $dir $file

              if (-not (Test-Path $path)) {
                  Write-Error "MISSING: $file"
                  exit 1
              }

              $size = (Get-Item $path).Length
              Write-Host "OK: $file ($size bytes)"
          }

          Write-Host ""
          Write-Host "=== CUDA DLLs ==="
          Write-Host ""

          Get-ChildItem $dir -Filter "*.dll" |
              Where-Object {
                  $_.Name -match "^(cudart|cublas|cublasLt).*\.dll$"
              } |
              Select-Object Name, Length

          Write-Host ""
          Write-Host "=== PACKAGE COMPLETE ==="

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cuda-windows-${{ matrix.cuda }}-escha-w2
          path: build/bin/Release/*
          if-no-files-found: error
          retention-days: 7
